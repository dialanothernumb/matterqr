services:
  matterqr:
    image: ghcr.io/dialanothernumb/matterqr:latest
    container_name: matterqr
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    # Optional: Google Drive backup. Leave these out and the backup card is hidden.
